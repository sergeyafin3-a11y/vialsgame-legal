<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Vials</title>
<meta name="robots" content="noindex">
<!--
  Smart install link.  Bio URL:  https://vialsgame.com/get
  Pure redirect, zero buttons: iOS -> App Store, Android -> Google Play,
  anything else -> App Store web listing. Campaign tokens let store
  analytics see TikTok traffic. (Before Google Play is live an Android
  visitor briefly hits Play's "not found" — accepted: real traffic is at
  the simultaneous launch moment when both stores are live.)
-->
<script>
  var APPSTORE = "https://apps.apple.com/app/id6783449445?ct=tiktok_bio";
  var PLAY = "https://play.google.com/store/apps/details?id=com.vialsgame.app" +
             "&referrer=utm_source%3Dtiktok%26utm_medium%3Dbio";
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/.test(ua);
  location.replace(isAndroid ? PLAY : APPSTORE);
</script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:#1c1b1a; background:#fbf8f3; }
  a { color:#b4612a; }
  @media (prefers-color-scheme: dark) { body { color:#ece7df; background:#1c1b1a; } }
</style>
</head>
<body>
  <!-- shown only if JS is disabled -->
  <p>Opening the store… <a href="https://apps.apple.com/app/id6783449445?ct=tiktok_bio">continue</a></p>
</body>
</html>
