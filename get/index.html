<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Vials — ASMR Sand Sort Puzzle</title>
<meta name="robots" content="noindex">
<!--
  Smart install link.  Bio URL:  https://vialsgame.com/get
  - iOS visitors are sent straight to the App Store.
  - Android is gated by ANDROID_LIVE below: flip it to true the moment the
    Google Play production listing is live, then commit + push. The bio link
    never changes.
  Self-contained (no external requests) to stay privacy-clean like the rest
  of the site. Campaign tokens (ct / utm) let store analytics see TikTok traffic.
-->
<script>
  // ---- ONE SWITCH: set to true when Google Play production is live ----
  var ANDROID_LIVE = false;
  // --------------------------------------------------------------------
  var APPSTORE = "https://apps.apple.com/app/id6783449445?ct=tiktok_bio";
  var PLAY = "https://play.google.com/store/apps/details?id=com.vialsgame.app" +
             "&referrer=utm_source%3Dtiktok%26utm_medium%3Dbio";

  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);

  if (isIOS) {
    location.replace(APPSTORE);
  } else if (isAndroid && ANDROID_LIVE) {
    location.replace(PLAY);
  }
  // otherwise: fall through to the branded card below (desktop, or Android
  // before the Play listing is live).
</script>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 100vh;
    padding: 40px 22px; box-sizing: border-box; text-align: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1c1b1a; background: #fbf8f3;
  }
  .mark { font-size: 46px; font-weight: 700; letter-spacing: -0.02em;
          font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
          margin: 0 0 4px; }
  .tag  { color: #6b6660; font-size: 15px; margin: 0 0 32px; }
  .btns { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; }
  .btn  { display: block; padding: 15px 20px; border-radius: 14px;
          font-size: 16px; font-weight: 600; text-decoration: none;
          border: 1px solid transparent; }
  .btn.ios  { background: #1c1b1a; color: #fbf8f3; }
  .btn.play { background: transparent; color: #b4612a; border-color: #e0d9cf; }
  .btn.soon { background: transparent; color: #9a948b; border-color: #e6e0d6;
              cursor: default; }
  .soon small { display: block; font-weight: 400; font-size: 12px; opacity: 0.8; }
  .foot { margin-top: 34px; font-size: 13px; color: #9a948b; }
  .foot a { color: #b4612a; }
  @media (prefers-color-scheme: dark) {
    body { color: #ece7df; background: #1c1b1a; }
    .tag { color: #9a948b; }
    .btn.ios  { background: #ece7df; color: #1c1b1a; }
    .btn.play { color: #d98a4e; border-color: #3a3733; }
    .btn.soon { color: #6b6660; border-color: #2f2c28; }
  }
</style>
</head>
<body>
  <h1 class="mark">Vials</h1>
  <p class="tag">ASMR Sand Sort Puzzle · free · play offline</p>

  <div class="btns">
    <a class="btn ios" href="https://apps.apple.com/app/id6783449445?ct=tiktok_bio">Download on the App Store</a>

    <!-- When ANDROID_LIVE flips to true, ALSO swap this block for the live link:
         <a class="btn play" href="https://play.google.com/store/apps/details?id=com.vialsgame.app&referrer=utm_source%3Dtiktok%26utm_medium%3Dbio">Get it on Google Play</a> -->
    <span class="btn soon">Google Play<small>coming very soon</small></span>
  </div>

  <p class="foot"><a href="https://vialsgame.com/">vialsgame.com</a></p>
</body>
</html>
