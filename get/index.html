<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Vials — ASMR Sand Sort Puzzle</title>
<meta name="robots" content="noindex">
<script>
  // Bio link:  https://vialsgame.com/get
  //
  // HOW THE STORE ACTUALLY OPENS FROM TIKTOK (verified on-device):
  // Tapping a link in the TikTok *bio* shows TikTok's "leaving TikTok" screen
  // (tiktoklinksafety.com) with an "Open" button. "Open" hands the URL to the
  // EXTERNAL browser / OS — and there this redirect fires and the App Store
  // opens natively. This is exactly how pufferfishgame.com works. The magic is
  // the bio → "Open" → external path, NOT the page code or the domain.
  //
  // Opening this page *inside* an in-app webview (TikTok/IG/FB) instead can't
  // hand off to the store at all, so we DON'T auto-redirect there (it would just
  // blank out) — we show the landing whose tap button is the fallback.
  //
  // So: external Safari/Chrome (incl. the bio "Open" path) -> straight to store.
  // In-app webview -> landing + tap. Desktop / Android -> landing.
  (function () {
    try {
      var loc = window.location;
      var params = new URLSearchParams(loc.search);
      if (params.has('stay')) return;                 // manual escape hatch
      if (document.referrer && document.referrer.indexOf(loc.origin) === 0) return;
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      if (!isIOS) return;                             // Android + desktop -> landing
      // In-app browsers can't hand off to the store -> don't redirect them.
      var inApp = /BytedanceWebview|musical_ly|TikTok|Instagram|FBAN|FBAV|FB_IAB|FBIOS|Line\/|Snapchat|Pinterest|Twitter|MicroMessenger|VKClient|OKApp|GSA/i.test(ua);
      if (inApp) return;                              // -> landing + tap button
      var src = params.get('utm_source') || params.get('from') || params.get('ref') || 'bio';
      // Region-agnostic App Store link (no country / slug) -> resolves to the
      // viewer's own storefront on-device.
      loc.replace('https://apps.apple.com/app/id6783449445?ct=' + encodeURIComponent(src));
      // ANDROID LAUNCH: replace the `if (!isIOS) return;` line above with:
      //   var isAndroid = /Android/.test(ua);
      //   if (!isIOS && !isAndroid) return;
      // and branch Android (external browsers only) to:
      //   loc.replace('https://play.google.com/store/apps/details?id=com.vialsgame.app&referrer='
      //     + encodeURIComponent('utm_source=' + src + '&utm_medium=social'));
    } catch (e) { /* fail open — show the landing page */ }
  })();
</script>

  .foot { margin-top: 40px; font-size: 13px; color: #9a948b; }

  @media (prefers-color-scheme: dark) {

  }
</style>
