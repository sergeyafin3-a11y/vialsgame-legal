<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Vials — ASMR Sand Sort Puzzle</title>
<meta name="robots" content="noindex">
<script>
  // GA4 web stream "Vials Web".
  //
  // Consent defaults run before the tag. Until 2026-08-12 this page declared
  // analytics_storage: 'denied' worldwide and never updated it — there is no
  // consent UI that could grant it. GA4 accepted every hit (HTTP 204) and
  // surfaced none of them: consent-denied traffic arrives as cookieless pings,
  // which feed modelling only and never appear in Realtime, in standard
  // reports, or in the BigQuery export. 803 paid landing-page views from
  // TikTok were therefore measured as zero. Proven by sending two otherwise
  // identical hits: gcs=G111 appeared in Realtime, gcs=G100 did not.
  //
  // Region-scoped defaults are Google's documented fix — the region entry wins
  // over the global one. EEA/UK/CH keep today's behaviour (nothing stored,
  // nothing measured, and no banner on a page that lives 300 ms); everywhere
  // else — which is where our traffic actually is — becomes measurable.
  // Advertising storage stays denied worldwide: this page does no remarketing.
  var GA_ID = 'G-WF00NX0NH6';
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('consent', 'default', {
    analytics_storage: 'denied',
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    region: ['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU',
             'IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO',
             'SK','SI','ES','SE','GB','CH']
  });
  gtag('consent', 'default', {
    analytics_storage: 'granted',
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied'
  });
  // Local previews/tests must not become acquisition traffic. The production
  // custom domain is the only host that loads the Google tag.
  if (window.location.hostname === 'vialsgame.com' ||
      window.location.hostname === 'www.vialsgame.com') {
    gtag('js', new Date());
    gtag('config', GA_ID);
    var gaScript = document.createElement('script');
    gaScript.async = true;
    gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(gaScript);
  }

  // Bio link: https://vialsgame.com/get  — one link, both platforms.
  //
  // In-app browsers (TikTok / Instagram / FB …) trap the page in a webview that
  // can't hand off to a store — no link/redirect escapes it and JS can't force
  // the system browser. Only the user tapping "⋯ → Open in browser" gets out.
  // So:
  //   - Real Safari on iOS      -> auto-redirect to the App Store.
  //   - Real Chrome on Android  -> auto-redirect to the Google Play listing.
  //       (Pre-launch the Play page 404s by design — the moment the listing is
  //        published it just starts working, no change needed here.)
  //   - In-app webview          -> platform-aware "Open in browser" instruction.
  //   - Desktop                 -> plain landing with both store buttons.
  //
  // Preview/debug params: ?stay=1 force landing · ?force=inapp show instruction ·
  //   ?os=ios|android override platform.
  var APPSTORE = 'https://apps.apple.com/app/id6783449445';
  var PLAY_ID  = 'com.vialsgame.app';
  // Apple only feeds `ct` into App Analytics → Campaigns when the link is a
  // canonical campaign link: provider token + campaign token + mt=8. Without
  // `pt` the tag is simply dropped, which is why "Кампании" stayed empty.
  // `pt` from ASC → Аналитика → Кампании (2026-07-27). NB: Apple needs installs
  // from 5 distinct Apple Accounts before it will show a campaign at all.
  var APPLE_PT = '128892810';

  // Trim + clamp BOTH branches: the fallback is itself query-string input
  // (`from` / `ref` / `ct`), so it needs the same 100-char clamp as the primary
  // param — otherwise a padded `?ct=…` walks unbounded into the GA payload.
  function campaignValue(params, name, fallback) {
    var value = params.get(name);
    var raw = value && value.trim() ? value : fallback;
    return raw && String(raw).trim() ? String(raw).trim().slice(0, 100) : '';
  }

  function appleCampaignToken(campaign) {
    // App Store Connect campaign names accept at most 30 characters. Fold the
    // reusable UTM tuple into one deterministic token for aggregate iOS
    // downloads; detailed UTMs remain available on the web side.
    var raw = [campaign.source, campaign.name, campaign.content]
      .filter(Boolean).join('-');
    return raw.replace(/[^a-zA-Z0-9._-]+/g, '-').replace(/^-+|-+$/g, '')
      .slice(0, 30) || 'bio';
  }

  function iosStoreUrl(campaign) {
    return APPSTORE + '?pt=' + APPLE_PT + '&ct=' +
      encodeURIComponent(appleCampaignToken(campaign)) + '&mt=8';
  }

  // Built by hand rather than with URLSearchParams: this runs on the fail-open
  // path too (a browser without URLSearchParams makes the head IIFE bail), and
  // there a constructor throw here would abort the tail script and strand a
  // mobile visitor on the desktop landing.
  function playStoreUrl(campaign) {
    var pairs = [
      ['utm_source', campaign.source],
      ['utm_medium', campaign.medium],
      ['utm_campaign', campaign.name],
      ['utm_content', campaign.content],
      ['utm_term', campaign.term],
      ['utm_id', campaign.id]
    ];
    var referrer = [];
    for (var i = 0; i < pairs.length; i++) {
      if (!pairs[i][1]) continue;
      referrer.push(encodeURIComponent(pairs[i][0]) + '=' +
        encodeURIComponent(pairs[i][1]));
    }
    return 'https://play.google.com/store/apps/details?id=' + PLAY_ID +
      '&referrer=' + encodeURIComponent(referrer.join('&'));
  }

  var CAMPAIGN_FALLBACK = {
    source: 'bio', medium: 'bio', name: '', content: '', term: '', id: ''
  };

  function currentCampaign() {
    // The head IIFE fails open (old browser, no URLSearchParams) and may leave
    // __campaign unset. Reading it unguarded threw inside the measurement call
    // and aborted the tail script — taking the store hand-off with it, so a
    // mobile visitor was stranded on the desktop landing.
    return window.__campaign || CAMPAIGN_FALLBACK;
  }

  function analyticsParams(extra) {
    var c = currentCampaign();
    return Object.assign({
      campaign_source: c.source,
      campaign_medium: c.medium,
      campaign_name: c.name || '(not set)',
      campaign_content: c.content || '(not set)',
      platform: window.__isIOS ? 'ios' :
        (window.__isAndroid ? 'android' : 'desktop'),
      in_app: window.__inApp ? 1 : 0
    }, extra || {});
  }

  function redirectToStore(store, url) {
    var navigated = false;
    function navigate() {
      if (navigated) return;
      navigated = true;
      window.location.replace(url);
    }
    // `transport_type` is a Universal Analytics field — GA4 gtag does not
    // consume it and would record it as a junk event parameter. GA4 already
    // uses navigator.sendBeacon, so the queued hit survives the navigation;
    // the timeout is only a floor for the callback, not for delivery.
    try {
      gtag('event', 'store_click', analyticsParams({
        store: store,
        automatic: 1,
        event_callback: navigate,
        event_timeout: 250
      }));
    } catch (e) { /* measurement is best-effort — the timeout still navigates */ }
    // Highest-intent path — keep the stall short. Without the tag loaded (any
    // non-production host) the callback never fires and this is the only exit.
    window.setTimeout(navigate, 300);
  }

  (function () {
    try {
      var loc = window.location;
      var params = new URLSearchParams(loc.search);
      var ua = navigator.userAgent || '';
      var oso = params.get('os');
      window.__isIOS     = oso ? oso === 'ios'     : (/iPad|iPhone|iPod/.test(ua) && !window.MSStream);
      window.__isAndroid = oso ? oso === 'android' : /Android/.test(ua);
      window.__inApp = params.get('force') === 'inapp' ||
        /BytedanceWebview|musical_ly|TikTok|Instagram|FBAN|FBAV|FB_IAB|FBIOS|Line\/|Snapchat|Pinterest|Twitter|MicroMessenger|VKClient|OKApp|GSA/i.test(ua);
      // `ct` is Apple's campaign-token param and the TikTok bio link is tagged
      // with it — read it too, or that traffic silently lands on the 'bio'
      // default and becomes indistinguishable from every other profile link.
      var source = campaignValue(params, 'utm_source',
        params.get('from') || params.get('ref') || params.get('ct') || 'bio');
      window.__campaign = {
        source: source,
        medium: campaignValue(params, 'utm_medium',
          source === 'bio' ? 'bio' : 'social'),
        name: campaignValue(params, 'utm_campaign', ''),
        content: campaignValue(params, 'utm_content', ''),
        term: campaignValue(params, 'utm_term', ''),
        id: campaignValue(params, 'utm_id', '')
      };
      // Kept for old preview snippets; all real links use __campaign now.
      window.__src = source;

      window.__stay = params.has('stay') ||
        (document.referrer && document.referrer.indexOf(loc.origin) === 0);
    } catch (e) { /* fail open -> landing */ }
  })();
</script>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 44px 22px; text-align: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1c1b1a; background: #fbf8f3;
  }
  .mark { margin: 0 0 6px; font-size: 52px; font-weight: 700; letter-spacing: -0.02em;
          font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
  .tag  { margin: 0 0 36px; font-size: 15px; color: #6b6660; }
  .btns { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }
  .btn  { display: block; padding: 16px 20px; border-radius: 14px;
          font-size: 17px; font-weight: 600; text-decoration: none;
          border: 1px solid transparent; background: #1c1b1a; color: #fbf8f3; }
  .foot { margin-top: 40px; font-size: 13px; color: #9a948b; }
  .foot a { color: #b4612a; }

  /* ---- in-app "open in browser" instruction ---- */
  #inapp { display: none; }
  .arrow {
    position: fixed; top: 6px; right: 14px; z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: #b4612a; font-weight: 700; font-size: 13px;
    animation: bob 1.1s ease-in-out infinite;
  }
  .arrow svg { width: 30px; height: 30px; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .card {
    width: 100%; max-width: 360px; margin: 0 auto;
    background: #fff; border: 1px solid #ece3d4; border-radius: 20px;
    padding: 26px 22px; box-shadow: 0 10px 40px rgba(28,27,26,.08);
  }
  .step { display: flex; align-items: center; gap: 12px; text-align: left;
          font-size: 16px; line-height: 1.4; margin: 0 0 14px; }
  .step:last-of-type { margin-bottom: 0; }
  .num  { flex: none; width: 26px; height: 26px; border-radius: 50%;
          background: #1c1b1a; color: #fbf8f3; font-size: 14px; font-weight: 700;
          display: flex; align-items: center; justify-content: center; }
  .dots { font-weight: 800; letter-spacing: 1px; }
  .or   { margin: 22px 0 0; font-size: 14px; color: #6b6660; }
  .or b { color: #1c1b1a; }
  @media (prefers-color-scheme: dark) {
    body { color: #ece7df; background: #1c1b1a; }
    .tag { color: #9a948b; }
    .btn  { background: #ece7df; color: #1c1b1a; }
    .card { background: #26231f; border-color: #35302a; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
    .num  { background: #ece7df; color: #1c1b1a; }
    .or b { color: #ece7df; }
    .arrow { color: #e0894f; }
  }
</style>
</head>
<body>
  <!-- Normal landing (real browsers / desktop) -->
  <div id="landing">
    <h1 class="mark">Vials</h1>
    <p class="tag">ASMR Sand Sort Puzzle · free · play offline</p>
    <div class="btns">
      <a class="btn" id="iosBtn" href="https://apps.apple.com/app/id6783449445?pt=128892810&amp;ct=bio&amp;mt=8"
         target="_blank" rel="noopener">Download on the App Store</a>
      <a class="btn" id="androidBtn"
         href="https://play.google.com/store/apps/details?id=com.vialsgame.app&amp;referrer=utm_source%3Dbio%26utm_medium%3Dbio"
         target="_blank" rel="noopener">Get it on Google Play</a>
    </div>
    <p class="foot"><a href="https://vialsgame.com/">vialsgame.com</a></p>
  </div>

  <!-- In-app browser: guide the user out to the real browser (text set per platform) -->
  <div id="inapp">
    <div class="arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <span>⋯ up here</span>
    </div>
    <h1 class="mark">Vials</h1>
    <p class="tag">ASMR Sand Sort Puzzle · free</p>
    <div class="card">
      <div class="step"><span class="num">1</span><span>Tap the <span class="dots">⋯</span> menu (top-right)</span></div>
      <div class="step"><span class="num">2</span><span>Choose <b>“Open in browser”</b></span></div>
      <div class="step"><span class="num">3</span><span id="step3">The store opens automatically</span></div>
      <p class="or" id="orLine">…or just search <b>“Vials”</b> in your app store.</p>
    </div>
  </div>

  <script>
    (function () {
      var campaign = currentCampaign();
      // Desktop / fell-through landing: carry the complete campaign tuple onto
      // both stores. The hrefs in the markup are only the no-JS fallback.
      var iosUrl = iosStoreUrl(campaign);
      var androidUrl = playStoreUrl(campaign);
      var iosBtn = document.getElementById('iosBtn');
      var androidBtn = document.getElementById('androidBtn');
      iosBtn.href = iosUrl;
      androidBtn.href = androidUrl;

      iosBtn.addEventListener('click', function () {
        gtag('event', 'store_click', analyticsParams({
          store: 'app_store', automatic: 0
        }));
      });
      androidBtn.addEventListener('click', function () {
        gtag('event', 'store_click', analyticsParams({
          store: 'google_play', automatic: 0
        }));
      });

      // Platform-aware wording for the in-app instruction.
      if (window.__inApp) {
        var isIOS = window.__isIOS, isAndroid = window.__isAndroid;
        var store = isAndroid && !isIOS ? 'Google Play' : (isIOS ? 'App Store' : 'store');
        var where = isAndroid && !isIOS ? 'on Google Play' : (isIOS ? 'in the App Store' : 'in your app store');
        document.getElementById('step3').textContent = 'The ' + store + ' opens automatically';
        document.getElementById('orLine').innerHTML = '…or just search <b>“Vials”</b> ' + where + '.';
        document.getElementById('landing').style.display = 'none';
        document.getElementById('inapp').style.display = 'block';
      }

      // Measurement must never be able to break the funnel it measures: the
      // store hand-off below runs even if the tag or the event payload throws.
      try {
        gtag('event', 'landing_view', analyticsParams());
      } catch (e) { /* measurement is best-effort */ }

      // Give the queued landing/store events a short window to leave before
      // the store hand-off. In-app webviews stay on the instruction; desktop
      // and ?stay=1 stay on the landing.
      if (!window.__inApp && !window.__stay) {
        if (window.__isIOS) {
          redirectToStore('app_store', iosUrl);
        } else if (window.__isAndroid) {
          redirectToStore('google_play', androidUrl);
        }
      }
    })();
  </script>
</body>
</html>
