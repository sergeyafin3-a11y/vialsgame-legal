<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Vials — ASMR Sand Sort Puzzle</title>
<meta name="robots" content="noindex">
<script>
  // Bio / ad link: https://vialsgame.com/get  — one link, both platforms.
  //
  // In-app browsers (TikTok / Instagram / FB …) trap the page in a webview and
  // cannot be forced out to Safari/Chrome. They CAN still reach the store app:
  // an `apps.apple.com` universal link opens the App Store, and an `intent://`
  // URL with `package=com.android.vending` opens Google Play. So a webview gets
  // ONE big store button — never a "⋯ → Open in browser" instruction, which is
  // where the ad traffic used to die (2026-07-27: ~128 taps -> 4 installs).
  //   - Real Safari on iOS      -> auto-redirect to the App Store.
  //   - Real Chrome on Android  -> auto-redirect to the Google Play listing.
  //   - In-app webview          -> single store button, platform-aware href.
  //   - Desktop                 -> plain landing with both store buttons.
  //
  // Preview/debug params: ?stay=1 force landing · ?force=inapp show webview UI ·
  //   ?os=ios|android override platform.
  var APPSTORE = 'https://apps.apple.com/app/id6783449445';
  var PLAY_ID  = 'com.vialsgame.app';

  function iosStoreUrl(src) {
    return APPSTORE + '?ct=' + encodeURIComponent(src);
  }
  function playStoreUrl(src) {
    return 'https://play.google.com/store/apps/details?id=' + PLAY_ID +
      '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=bio');
  }
  // Opens the Play Store *app* from inside a webview; falls back to the https
  // listing on its own if the intent cannot be resolved.
  function playIntentUrl(src) {
    return 'intent://details?id=' + PLAY_ID +
      '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=bio') +
      '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' +
      encodeURIComponent(playStoreUrl(src)) + ';end';
  }

  (function () {
    try {
      var loc = window.location;
      var params = new URLSearchParams(loc.search);
      var ua = navigator.userAgent || '';
      var oso = params.get('os');
      window.__isIOS     = oso ? oso === 'ios'     : (/iPad|iPhone|iPod/.test(ua) && !window.MSStream);
      window.__isAndroid = oso ? oso === 'android' : /Android/.test(ua);
      window.__inApp = params.get('force') === 'inapp' ||
        /BytedanceWebview|musical_ly|TikTok|Instagram|FBAN|FBAV|FB_IAB|FBIOS|Line\/|Snapchat|Pinterest|Twitter|MicroMessenger|VKClient|OKApp|GSA/i.test(ua);
      window.__src = params.get('utm_source') || params.get('from') || params.get('ref') || 'bio';

      if (params.get('force') === 'inapp') return;   // preview the webview UI
      if (params.has('stay')) return;                 // force landing
      if (document.referrer && document.referrer.indexOf(loc.origin) === 0) return;
      if (window.__inApp) return;                     // in-app -> store button below

      // Real external browser -> straight to the right store.
      if (window.__isIOS) {
        loc.replace(iosStoreUrl(window.__src));
      } else if (window.__isAndroid) {
        loc.replace(playStoreUrl(window.__src));
      }
      // desktop -> fall through to landing
    } catch (e) { /* fail open -> landing */ }
  })();
</script>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 44px 22px; text-align: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1c1b1a; background: #fbf8f3;
  }
  .mark { margin: 0 0 6px; font-size: 52px; font-weight: 700; letter-spacing: -0.02em;
          font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
  .tag  { margin: 0 0 36px; font-size: 15px; color: #6b6660; }
  .btns { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }
  .btn  { display: block; padding: 16px 20px; border-radius: 14px;
          font-size: 17px; font-weight: 600; text-decoration: none;
          border: 1px solid transparent; background: #1c1b1a; color: #fbf8f3; }
  .foot { margin-top: 40px; font-size: 13px; color: #9a948b; }
  .foot a { color: #b4612a; }

  /* ---- in-app webview: one tap to the store ---- */
  #inapp { display: none; }
  .btn.alt { background: transparent; color: #1c1b1a; border-color: #d9d0c1; }
  .hint  { margin: 26px 0 0; font-size: 13px; color: #9a948b; }
  .dots  { font-weight: 800; letter-spacing: 1px; }
  @media (prefers-color-scheme: dark) {
    body { color: #ece7df; background: #1c1b1a; }
    .tag { color: #9a948b; }
    .btn { background: #ece7df; color: #1c1b1a; }
    .btn.alt { background: transparent; color: #ece7df; border-color: #45403a; }
  }
</style>
</head>
<body>
  <!-- Normal landing (real browsers / desktop) -->
  <div id="landing">
    <h1 class="mark">Vials</h1>
    <p class="tag">ASMR Sand Sort Puzzle · free · play offline</p>
    <div class="btns">
      <a class="btn" id="iosBtn" href="https://apps.apple.com/app/id6783449445?ct=tiktok_bio"
         target="_blank" rel="noopener">Download on the App Store</a>
      <a class="btn" id="androidBtn"
         href="https://play.google.com/store/apps/details?id=com.vialsgame.app&referrer=utm_source%3Dbio%26utm_medium%3Dbio"
         target="_blank" rel="noopener">Get it on Google Play</a>
    </div>
    <p class="foot"><a href="https://vialsgame.com/">vialsgame.com</a></p>
  </div>

  <!-- In-app browser (TikTok / Instagram / …): one tap straight to the store app -->
  <div id="inapp">
    <h1 class="mark">Vials</h1>
    <p class="tag">ASMR Sand Sort Puzzle · free · play offline</p>
    <div class="btns">
      <a class="btn" id="storeBtn" href="#">Get the game</a>
      <a class="btn alt" id="storeBtn2" href="#">Get it on Google Play</a>
    </div>
    <p class="hint" id="hint">Doesn’t open? Tap <span class="dots">⋯</span> → “Open in browser”.</p>
  </div>

  <script>
    (function () {
      var src = window.__src;

      // Landing (desktop / real browser that fell through) — carry the source tag.
      document.getElementById('iosBtn').href = iosStoreUrl(src);
      document.getElementById('androidBtn').href = playStoreUrl(src);

      if (!window.__inApp) return;

      var isIOS = window.__isIOS, isAndroid = window.__isAndroid;
      var one = document.getElementById('storeBtn');
      var two = document.getElementById('storeBtn2');

      if (isAndroid && !isIOS) {
        one.href = playIntentUrl(src);          // opens the Play Store app
        one.textContent = 'Get it on Google Play';
        two.style.display = 'none';
      } else if (isIOS) {
        one.href = iosStoreUrl(src);            // universal link -> App Store app
        one.textContent = 'Download on the App Store';
        two.style.display = 'none';
      } else {
        // Unknown platform inside a webview -> offer both, plain https.
        one.href = iosStoreUrl(src);
        one.textContent = 'Download on the App Store';
        two.href = playStoreUrl(src);
      }

      document.getElementById('landing').style.display = 'none';
      document.getElementById('inapp').style.display = 'block';
    })();
  </script>
</body>
</html>
